name: Build and push artifacts

on:
  push:
    tags:
      - 'v*'

env:
  IMAGE_DOMAIN: common
  HELM_DOMAIN: vector
  IMAGE_REPOSITORY: geoserver-os

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # shared actions run checkout@v4 again; persisted v6 credentials cause a duplicate Authorization header
          persist-credentials: false

      - name: Artifactory Login
        uses: MapColonies/shared-workflows/actions/artifactory-login@artifactory-login-v1.0.0
        with:
          registry: ${{ secrets.ACR_URL }}
          username: ${{ secrets.ACR_PUSH_USER }}
          password: ${{ secrets.ACR_PUSH_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Docker Image
        id: build
        env:
          IMAGE_REPO: ${{ env.IMAGE_REPOSITORY }}
          IMAGE_DOCKER_REGISTRY: ${{ secrets.ACR_URL }}/${{ env.IMAGE_DOMAIN }}
        run: |
          npx zx index.mjs
          docker_image_full_name="${IMAGE_DOCKER_REGISTRY}/${IMAGE_REPO}"
          # index.mjs doesn't fail on errors, so verify the image was actually built
          docker_image_tag=$(docker images "$docker_image_full_name" --format '{{.Tag}}' | head -n 1)
          test -n "$docker_image_tag"
          echo "docker_image_full_name=${docker_image_full_name}" >> "$GITHUB_OUTPUT"
          echo "docker_image_tag=${docker_image_tag}" >> "$GITHUB_OUTPUT"

      - name: Push Docker Image
        uses: MapColonies/shared-workflows/actions/push-docker@push-docker-v1.0.1
        with:
          image_name: ${{ steps.build.outputs.docker_image_full_name }}
          image_tag: ${{ steps.build.outputs.docker_image_tag }}

      - name: Build and Push Helm Chart
        uses: MapColonies/shared-workflows/actions/build-and-push-helm@build-and-push-helm-v1.0.1
        with:
          context: ./helm
          domain: ${{ env.HELM_DOMAIN }}
          registry: ${{ secrets.ACR_URL }}

      - name: Update Artifacts File- Docker
        uses: MapColonies/shared-workflows/actions/update-artifacts-file@update-artifacts-file-v1.1.1
        with:
          domain: ${{ env.IMAGE_DOMAIN }}
          artifact_name: ${{ env.IMAGE_REPOSITORY }}
          artifact_tag: ${{ steps.build.outputs.docker_image_tag }}
          type: docker
          registry: ${{ secrets.ACR_URL }}
          github_token: ${{ secrets.GH_PAT }}

      - name: Update Artifacts File- Helm
        uses: MapColonies/shared-workflows/actions/update-artifacts-file@update-artifacts-file-v1.1.1
        with:
          domain: ${{ env.HELM_DOMAIN }}
          artifact_name: ${{ github.event.repository.name }}
          artifact_tag: ${{ github.ref_name }}
          type: helm
          registry: ${{ secrets.ACR_URL }}
          github_token: ${{ secrets.GH_PAT }}
